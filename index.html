
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Guess Game</title>

<link rel="stylesheet" href="css/styles.css">

</head>

<body>

<div class="main">

<!-- GAME AREA -->

<div class="game">

<h1>🎮 Number Guess Game</h1>

<button class="primary" onclick="toggleTheme()">🌓 Theme</button>

<br><br>

<input id="guessInput" maxlength="4" placeholder="4 digits">

<br><br>

<button class="primary" onclick="guess()">Guess</button>

<h3 id="result"></h3>
<h4 id="remaining"></h4>

<div class="keyboard">

<button onclick="addNum(1)">1</button>
<button onclick="addNum(2)">2</button>
<button onclick="addNum(3)">3</button>

<button onclick="addNum(4)">4</button>
<button onclick="addNum(5)">5</button>
<button onclick="addNum(6)">6</button>

<button onclick="addNum(7)">7</button>
<button onclick="addNum(8)">8</button>
<button onclick="addNum(9)">9</button>

<button class="backspace" onclick="deleteNum()">⌫</button>
<button onclick="addNum(0)">0</button>
<button class="enter" onclick="guess()">➡</button>

</div>

</div>

<!-- SIDE PANEL -->

<div class="sidePanel">

<div class="dashboard">

<h3>📊 Game Dashboard</h3>

<div class="stats">
<div>🏆 Wins: <span id="wins">0</span></div>
<div>🎮 Games: <span id="games">0</span></div>
<div>📊 Win Rate: <span id="rate">0%</span></div>
<div>🔥 Streak: <span id="streak">0</span></div>
<div>🎯 Best Game: <span id="best">-</span></div>
</div>

</div>

<h3>📜 Guess History</h3>

<div id="history" class="history"></div>

</div>

</div>

<script src="js/game.js"></script>

</body>
</html>
