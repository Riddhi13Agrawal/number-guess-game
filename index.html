<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Guess Game</title>

<link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div class="main-container">

    <!-- GAME SECTION -->
    <div class="game-section">

        <h1>🎮 Number Guess Game</h1>

        <button class="theme-btn" onclick="toggleTheme()">🌗 Theme</button>

        <br><br>

        <input id="guessInput" class="guess-input" placeholder="4 digits" maxlength="4">

        <button class="guess-btn" onclick="guess()">Guess</button>

        <p id="remaining" class="guesses-left">Guesses Left: 20</p>

        <h3 id="result"></h3>

        <!-- KEYPAD -->
        <div class="keypad">

            <button onclick="addNum(1)">1</button>
            <button onclick="addNum(2)">2</button>
            <button onclick="addNum(3)">3</button>

            <button onclick="addNum(4)">4</button>
            <button onclick="addNum(5)">5</button>
            <button onclick="addNum(6)">6</button>

            <button onclick="addNum(7)">7</button>
            <button onclick="addNum(8)">8</button>
            <button onclick="addNum(9)">9</button>

            <button class="delete" onclick="deleteNum()">⌫</button>
            <button onclick="addNum(0)">0</button>
            <button class="enter" onclick="guess()">➡</button>

        </div>

    </div>


    <!-- DASHBOARD -->
    <div class="dashboard-section">

        <h2>📊 Game Dashboard</h2>

        <div class="stat">🏆 Wins: <span id="wins">0</span></div>
        <div class="stat">🎮 Games: <span id="games">0</span></div>
        <div class="stat">📈 Win Rate: <span id="rate">0%</span></div>
        <div class="stat">🔥 Streak: <span id="streak">0</span></div>
        <div class="stat">🎯 Best Game: <span id="best">-</span></div>

    </div>


    <!-- HISTORY -->
    <div class="history-section">

        <h2>📜 Guess History</h2>

        <div id="history" class="history-list"></div>

    </div>

</div>

<!-- GAME SCRIPT -->
<script src="game.js"></script>

</body>
</html>
